<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      `user-scalable=no` and `maximum-scale=1` are two of the three things that
      stop a phone zooming this app. The other two are `touch-action: pan-y` in
      index.css and the gesture guard in `lib/lockZoom.ts`, no one of the three
      covers Android, desktop and iOS on its own. Every form control in the app
      is also at least 16px on a touch device, which is what actually stops
      Mobile Safari zooming on focus; the meta tag alone is ignored there.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#07884f" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161618" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/icon.svg?v=3" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png?v=3" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="/appicon/white-apple-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!--
      The installed app's icon: white (the default) or blue, chosen in Profile,
      Appearance. Set here, before anything else runs, so the browser reads the
      chosen icon whenever it installs the app. See src/lib/appIcon.ts.
    -->
    <script>
      (function () {
        /* The app installs from app.afterbi.com only. Installed from the website, it would open the app outside its own frame and show the address bar. */
        var h = location.hostname;
        if (h === 'afterbi.com' || h === 'www.afterbi.com') {
          var m = document.querySelector('link[rel="manifest"]');
          if (m) m.parentNode.removeChild(m);
          return;
        }
        try {
          if (localStorage.getItem('ab.appicon') !== 'blue') return;
          document.querySelector('link[rel="apple-touch-icon"]').href = '/appicon/blue-apple-180.png';
          document.querySelector('link[rel="manifest"]').href = '/manifest-blue.webmanifest';
        } catch (e) { /* the white icon it is */ }
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="AfterBI" />
    <meta name="application-name" content="AfterBI" />
    <!--
      The defaults, for the frame before React renders and for anything that
      never runs it. Every public page then declares its own through the `Seo`
      component, which React 19 hoists into this head and swaps on navigation.
    -->
    <title>AfterBI: the sales and distribution platform</title>
    <meta
      name="description"
      content="AfterBI is the sales and distribution platform for consumer goods companies: pipeline, orders, inventory, billing, credit and channel intelligence on one secure cloud platform."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!--
      THE STATIC SHELL, IN TWO SHAPES.

      Painted by the browser before a single byte of JavaScript has run, and it
      is the same shape the matching React skeleton draws once the bundle takes
      over, so there is no frame where the layout changes and no white flash on
      a cold load over a slow connection. It is removed by the first React
      render.

      TWO SHAPES, BECAUSE THIS APP HAS TWO FRONTS.

      It used to draw one: a rail, a bar and two cards, which is the portal. On
      the day the public site went in, that became the wrong picture for the
      visitor who matters most, somebody arriving at afterbi.com for the first
      time, on a phone, who got a second and a half of somebody else's
      navigation furniture before the front page appeared. The script below
      picks from the address, which is known long before the router is.

      The dark variables are inlined here rather than waiting for the stylesheet
      because this markup paints first; without them somebody on a dark phone
      gets a white rectangle for the length of one network round trip.
    -->
    <style>
      :root { --sk-page: #f4f5f7; --sk-card: #ffffff; --sk-line: rgba(17,18,20,.08); --sk-fill: #eef0f3; --sk-ink: #111214; }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) { --sk-page: #161618; --sk-card: #232325; --sk-line: rgba(255,255,255,.09); --sk-fill: #1c1c1e; --sk-ink: #ffffff; }
      }
      html[data-theme='dark'] { --sk-page: #161618; --sk-card: #232325; --sk-line: rgba(255,255,255,.09); --sk-fill: #1c1c1e; --sk-ink: #ffffff; }
      html, body { margin: 0; height: 100%; background: var(--sk-page); }
      /*
        While the app opens: the moving wallpaper (AfterBI blue drifting through
        purple, pink, teal and night blue) with the petals turning, the three
        white bars of the logo in the middle and the name and line at the foot.
        When the PIN screen (or sign in) has drawn, the bars rush forward,
        filling the screen and fading, and the page shows through them; see
        src/lib/boot.ts. A copy of .ab-wall in src/index.css.
        The public website opens on its plain page colour instead.
      */
      #splash { position: fixed; inset: 0; z-index: 9999; overflow: hidden; isolation: isolate; background: #1238e6; transition: opacity .25s ease; }
      #splash.gone { opacity: 0; pointer-events: none; }
      html[data-boot='site'] #splash { background: var(--sk-page); }
      html[data-boot='site'] #splash > * { display: none; }
      #splash .ab-wall-l { position: absolute; inset: -25%; pointer-events: none; z-index: -1; }
      #splash .ab-wall-a { background: radial-gradient(45% 40% at 30% 30%, #2f6bff 0%, transparent 70%), radial-gradient(50% 45% at 75% 70%, #0b2bd1 0%, transparent 70%); animation: ab-wall-drift 26s ease-in-out infinite alternate; }
      #splash .ab-wall-b { background: radial-gradient(50% 45% at 72% 28%, #7c3aed 0%, transparent 72%), radial-gradient(45% 40% at 22% 78%, #5b21b6 0%, transparent 72%); opacity: 0; animation: ab-wall-fade 18s ease-in-out infinite, ab-wall-drift 30s ease-in-out infinite alternate-reverse; }
      #splash .ab-wall-c { background: linear-gradient(165deg, #0c1550 0%, #050a26 100%); opacity: 0; animation: ab-wall-dark 24s ease-in-out infinite; }
      #splash .ab-wall-d { background: radial-gradient(30% 28% at 85% 85%, rgba(236,72,153,.7) 0%, transparent 70%), radial-gradient(28% 26% at 12% 15%, rgba(14,165,233,.7) 0%, transparent 70%); opacity: 0; animation: ab-wall-fade 14s ease-in-out 5s infinite; }
      #splash svg { position: absolute; color: #fff; animation: ab-turn 90s linear infinite; }
      #splash .p1 { right: -9vmin; top: -7vmin; width: max(34vmin, 170px); height: max(34vmin, 170px); }
      #splash .p2 { left: -12vmin; bottom: -10vmin; width: max(48vmin, 230px); height: max(48vmin, 230px); animation-direction: reverse; animation-duration: 120s; }
      @media (min-width: 1024px) {
        #splash .p1 { right: -4vmin; top: -6vmin; width: 46vmin; height: 46vmin; }
        #splash .p2 { left: -6vmin; bottom: -12vmin; width: 58vmin; height: 58vmin; }
      }
      @keyframes ab-wall-drift { from { transform: translate3d(-4%,-3%,0) rotate(0deg); } to { transform: translate3d(4%,3%,0) rotate(8deg); } }
      @keyframes ab-wall-fade { 0%, 100% { opacity: 0; } 50% { opacity: .9; } }
      @keyframes ab-wall-dark { 0%, 30%, 100% { opacity: 0; } 60%, 72% { opacity: .78; } }
      @keyframes ab-turn { to { transform: rotate(360deg); } }
      /* The logo: the three bars alone, white, in the middle. Bolder on a big screen. */
      #splash .sp-logo { position: absolute; left: 50%; top: 50%; width: clamp(88px, 24vw, 112px); transform: translate(-50%, -50%); animation: sp-in .55s cubic-bezier(.2,.9,.25,1) both; }
      #splash .sp-logo svg { position: static; display: block; width: 100%; height: auto; overflow: visible; animation: sp-breathe 2.6s ease-in-out .6s infinite; }
      #splash .sp-foot { position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 9vh); text-align: center; color: #fff; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; animation: sp-in .6s ease .15s both; }
      #splash .sp-name { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
      #splash .sp-line { margin: 6px 0 0; font-size: 13.5px; font-weight: 500; opacity: .78; }
      #splash .sp-line sup { font-size: .6em; margin-left: 1px; }
      @media (min-width: 1024px) {
        #splash .sp-logo { width: 168px; }
        #splash .sp-foot { bottom: 7vh; }
        #splash .sp-name { font-size: 22px; }
        #splash .sp-line { font-size: 14.5px; }
      }
      /* The way out: the bars rush forward and fade, the page shows through them. */
      #splash.zoom { transition: background-color .45s ease .2s; background-color: transparent; pointer-events: none; }
      #splash.zoom .ab-wall-l, #splash.zoom > svg { opacity: 0 !important; transition: opacity .4s ease .18s; }
      #splash.zoom .sp-foot { opacity: 0; transition: opacity .2s ease; }
      #splash.zoom .sp-logo { animation: sp-zoom .78s cubic-bezier(.65,0,.25,1) forwards; }
      #splash.zoom .sp-logo svg { animation: none; }
      @keyframes sp-in { from { opacity: 0; transform: translate(-50%, -50%) scale(.82); } }
      @keyframes sp-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
      @keyframes sp-zoom {
        0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        18% { transform: translate(-50%, -50%) scale(.9); opacity: 1; }
        70% { opacity: .38; }
        100% { transform: translate(-50%, -50%) scale(26); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) { #splash *, #splash.zoom .sp-logo { animation: none !important; } }
    </style>

    <!--
      Which front door this is. Runs in the head, before anything paints, and
      reads only `location.pathname`: the portal lives under /portal and the
      two auth screens are their own addresses, so everything else is the
      public site. Wrapped because a host that serves this markup without a
      location (a prerenderer, a mail client preview) must fall through to the
      portal shell rather than throw and paint nothing at all.
    -->
    <script>
      (function () {
        try {
          var p = location.pathname;
          var app = p.indexOf('/portal') === 0 || p === '/login' || p === '/forgot-password';
          if (!app) document.documentElement.setAttribute('data-boot', 'site');
        } catch (e) { /* portal shell it is */ }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="boot"></div>
    </div>
    <!--
      THE ONE OPENING SCREEN: the moving wallpaper and petals, the white bars
      in the middle and the name at the foot. Outside #root, so React mounting does not remove it: it
      stays until the first real page has drawn, then fades (src/lib/boot.ts).
    -->
    <div id="splash" role="status" aria-label="Loading AfterBI">
      <i class="ab-wall-l ab-wall-a"></i><i class="ab-wall-l ab-wall-b"></i><i class="ab-wall-l ab-wall-c"></i><i class="ab-wall-l ab-wall-d"></i>
      <svg class="p1" viewBox="0 0 100 100" fill="currentColor" aria-hidden="true"><g opacity=".1"><path d="M50 50 Q22 18 50 4 Q78 18 50 50 Z"/><path d="M50 50 Q22 18 50 4 Q78 18 50 50 Z" transform="rotate(90 50 50)"/><path d="M50 50 Q22 18 50 4 Q78 18 50 50 Z" transform="rotate(180 50 50)"/><path d="M50 50 Q22 18 50 4 Q78 18 50 50 Z" transform="rotate(270 50 50)"/></g></svg>
      <svg class="p2" viewBox="0 0 100 100" fill="currentColor" opacity=".08" aria-hidden="true"><ellipse cx="50" cy="26" rx="14" ry="24"/><ellipse cx="50" cy="26" rx="14" ry="24" transform="rotate(60 50 50)"/><ellipse cx="50" cy="26" rx="14" ry="24" transform="rotate(120 50 50)"/><ellipse cx="50" cy="26" rx="14" ry="24" transform="rotate(180 50 50)"/><ellipse cx="50" cy="26" rx="14" ry="24" transform="rotate(240 50 50)"/><ellipse cx="50" cy="26" rx="14" ry="24" transform="rotate(300 50 50)"/><circle cx="50" cy="50" r="22"/></svg>
      <div class="sp-logo" aria-hidden="true"><svg viewBox="14 26 72 48" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round"><path d="M22.0 68.0L33.6 46.1M40.5 68.0L56.1 38.6M59.0 68.0L78.0 32.0"/></svg></div>
      <div class="sp-foot"><p class="sp-name">AfterBI</p><p class="sp-line">Smart distribution, made simple.<sup>™</sup></p></div>
    </div>
    <!--
      A BOOT FAILURE THAT SAYS WHAT IS WRONG, RATHER THAN A WHITE SCREEN.

      `lib/firebase.ts` throws at module scope when a `VITE_FIREBASE_*` variable
      is missing. That is deliberate, the build this replaced shipped a real
      project's keys as literals, so every fork pointed at production, but a
      module-scope throw happens while the bundle is still evaluating, before
      React exists. `ErrorBoundary` cannot catch it. Nothing in the bundle can.
      The page stays blank and the only evidence is a console line that whoever
      just deployed is probably not looking at.

      That is precisely the state a first deploy lands in, because nothing about
      a missing environment variable stops the build: Vite writes these values
      into the bundle at build time, so it compiles perfectly and then has
      nothing to connect to.

      This is inline, and before the module, for two reasons. It is the only
      code guaranteed to have run when the bundle throws, and it is the only
      code that runs at all if the bundle 404s, which is what a wrong output
      directory looks like from the browser.
    -->
    <script>
      (function () {
        var painted = false;

        function paint(message) {
          if (painted) return;
          painted = true;
          var root = document.getElementById('root');
          if (!root) return;

          var missing = /(VITE_[A-Z_]+) is not set/.exec(message || '');

          /* Built with the DOM, not innerHTML: `message` is an exception string
             and nothing has sanitised it. Styles are inline because the
             stylesheet may be the thing that did not load. */
          var box = document.createElement('div');
          box.setAttribute(
            'style',
            'max-width:34rem;margin:12vh auto;padding:0 1.5rem;font:15px/1.65 -apple-system,' +
              'BlinkMacSystemFont,Segoe UI,Arial,sans-serif;color:#1a1d21'
          );

          /* Plain words only: this page is public, so the details go to the console, never on screen. */
          if (message) console.error('AfterBI could not start:', message);
          var h = document.createElement('h1');
          h.setAttribute('style', 'font-size:19px;font-weight:800;margin:0 0 .75rem');
          h.textContent = 'AfterBI could not start';

          var p = document.createElement('p');
          p.setAttribute('style', 'margin:0 0 1rem;color:#41474d');
          p.textContent = 'Something went wrong while opening the app. Check your connection and refresh the page.';

          var q = document.createElement('p');
          q.setAttribute('style', 'margin:0;font-size:13px;color:#7a8087');
          q.textContent = missing
            ? 'The site is being updated. Please try again in a few minutes.'
            : 'If it keeps happening, contact info@afterbi.com.';

          box.appendChild(h);
          box.appendChild(p);
          box.appendChild(q);
          var sp = document.getElementById('splash');
          if (sp) sp.remove();
          root.replaceChildren ? root.replaceChildren(box) : ((root.innerHTML = ''), root.appendChild(box));
        }

        /* `true` for the capture phase, which is the only way to see a script
           that failed to LOAD: a resource error fires on the element and does
           not bubble, so a normal listener never hears it. That case is what a
           wrong output directory looks like from inside the browser. */
        window.addEventListener(
          'error',
          function (event) {
            /* Only while the skeleton is still the only thing on screen. Once
               React has mounted, its own ErrorBoundary owns the failure, and
               painting over a working app would be the bug. */
            if (!document.getElementById('boot')) return;

            var target = event && event.target;
            if (target && target !== window && target.tagName) {
              /*
               * A RESOURCE FAILED, NOT THE APP.
               *
               * Capturing catches every one of these, and the first version of
               * this guard treated them all as fatal, so a blocked Google
               * Fonts request painted "the bundle did not load" and, because it
               * arrives before the app's own error, buried the real message
               * naming the missing variable. A font that does not arrive is a
               * different typeface, not a broken app; the same goes for an
               * image. Only the bundle itself matters here.
               */
              if (target.tagName === 'SCRIPT' && target.type === 'module') paint('');
              return;
            }

            paint((event && event.message) || '');
          },
          true
        );

        /*
         * Last resort, and deliberately patient.
         *
         * This app's users are on mid-range Android phones on metered Nigerian
         * data, in depots with two bars, a cold load genuinely can take ten
         * seconds, and telling somebody it is broken while it is merely slow is
         * worse than the skeleton they were already looking at. Twenty-five
         * seconds is past any real cold start; if React does mount afterwards
         * it replaces this anyway, so the failure mode is self-correcting.
         */
        window.setTimeout(function () {
          if (document.getElementById('boot')) paint('');
        }, 25000);
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
