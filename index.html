<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      `user-scalable=no` and `maximum-scale=1` are two of the three things that
      stop a phone zooming this app. The other two are `touch-action: pan-y` in
      index.css and the gesture guard in `lib/lockZoom.ts`, no one of the three
      covers Android, desktop and iOS on its own. Every form control in the app
      is also at least 16px on a touch device, which is what actually stops
      Mobile Safari zooming on focus; the meta tag alone is ignored there.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#064e3b" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1f18" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="AfterBI" />
    <meta name="application-name" content="AfterBI" />
    <!--
      The defaults, for the frame before React renders and for anything that
      never runs it. Every public page then declares its own through the `Seo`
      component, which React 19 hoists into this head and swaps on navigation.
    -->
    <title>AfterBI: the sales and distribution platform</title>
    <meta
      name="description"
      content="AfterBI is the sales and distribution platform for consumer goods companies: pipeline, orders, inventory, billing, credit and channel intelligence on one secure cloud platform."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <!--
      THE STATIC SHELL, IN TWO SHAPES.

      Painted by the browser before a single byte of JavaScript has run, and it
      is the same shape the matching React skeleton draws once the bundle takes
      over, so there is no frame where the layout changes and no white flash on
      a cold load over a slow connection. It is removed by the first React
      render.

      TWO SHAPES, BECAUSE THIS APP HAS TWO FRONTS.

      It used to draw one: a rail, a bar and two cards, which is the portal. On
      the day the public site went in, that became the wrong picture for the
      visitor who matters most, somebody arriving at afterbi.com for the first
      time, on a phone, who got a second and a half of somebody else's
      navigation furniture before the front page appeared. The script below
      picks from the address, which is known long before the router is.

      The dark variables are inlined here rather than waiting for the stylesheet
      because this markup paints first; without them somebody on a dark phone
      gets a white rectangle for the length of one network round trip.
    -->
    <style>
      :root { --sk-page: #ffffff; --sk-card: #ffffff; --sk-line: rgba(20,23,28,.1); --sk-fill: #f4f6f8; --sk-ink: #0f1f36; }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) { --sk-page: #0b0d10; --sk-card: #14171c; --sk-line: rgba(255,255,255,.1); --sk-fill: #101317; --sk-ink: #ffffff; }
      }
      html[data-theme='dark'] { --sk-page: #0b0d10; --sk-card: #14171c; --sk-line: rgba(255,255,255,.1); --sk-fill: #101317; --sk-ink: #ffffff; }
      html, body { margin: 0; height: 100%; background: var(--sk-page); }
      /* The splash: the AfterBI mark filling bar by bar, like a signal, then the name. */
      #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-family: Inter, system-ui, sans-serif; }
      #boot .name { font-size: 30px; font-weight: 800; letter-spacing: -0.04em; color: var(--sk-ink); }
      .ab-signal rect { transform-box: fill-box; transform-origin: 50% 100%; animation: ab-signal 1.6s cubic-bezier(.3,.7,.3,1) infinite; opacity: .16; }
      .ab-signal .b2 { animation-delay: .16s; } .ab-signal .b3 { animation-delay: .32s; } .ab-signal .b4 { animation-delay: .48s; }
      @keyframes ab-signal { 0% { opacity: .16; transform: scaleY(.55); } 18% { opacity: 1; transform: scaleY(1.06); } 26%, 70% { opacity: 1; transform: scaleY(1); } 88%, 100% { opacity: .16; transform: scaleY(.55); } }
      @media (prefers-reduced-motion: reduce) { .ab-signal rect { animation: none; opacity: 1; } }
      /* The splash wallpaper: faint line drawings of the trade (bars, carts, boxes, trucks, receipts), like a chat app's background. */
      :root { --ab-doodle: url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22260%22 height=%22260%22 viewBox=%220 0 260 260%22 fill=%22none%22 stroke=%22rgba(15,31,54,0.07)%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E %3Cg transform=%22translate(18 20) rotate(-8)%22%3E%3Crect x=%220%22 y=%2222%22 width=%227%22 height=%2212%22 rx=%223.5%22/%3E%3Crect x=%2211%22 y=%2215%22 width=%227%22 height=%2219%22 rx=%223.5%22/%3E%3Crect x=%2222%22 y=%228%22 width=%227%22 height=%2226%22 rx=%223.5%22/%3E%3Crect x=%2233%22 y=%220%22 width=%227%22 height=%2234%22 rx=%223.5%22/%3E%3C/g%3E %3Cg transform=%22translate(100 18)%22%3E%3Cpath d=%22M0 4h6l6 22h20l5-16H9%22/%3E%3Ccircle cx=%2215%22 cy=%2232%22 r=%222.5%22/%3E%3Ccircle cx=%2229%22 cy=%2232%22 r=%222.5%22/%3E%3C/g%3E %3Cg transform=%22translate(190 26) rotate(10)%22%3E%3Cpath d=%22M0 10l16-9 16 9v18l-16 9-16-9z%22/%3E%3Cpath d=%22M0 10l16 9 16-9M16 19v18%22/%3E%3C/g%3E %3Cg transform=%22translate(26 104)%22%3E%3Cpath d=%22M0 30l11-12 9 7 15-17%22/%3E%3Cpath d=%22M28 8h7v7%22/%3E%3Cpath d=%22M0 38h40%22/%3E%3C/g%3E %3Cg transform=%22translate(112 98) rotate(-6)%22%3E%3Cpath d=%22M0 6h22v20H0zM22 12h9l6 7v7H22%22/%3E%3Ccircle cx=%227%22 cy=%2229%22 r=%223%22/%3E%3Ccircle cx=%2230%22 cy=%2229%22 r=%223%22/%3E%3C/g%3E %3Cg transform=%22translate(196 104)%22%3E%3Cpath d=%22M2 0h24v36l-4-3-4 3-4-3-4 3-4-3-4 3z%22/%3E%3Cpath d=%22M8 9h12M8 16h12M8 23h7%22/%3E%3C/g%3E %3Cg transform=%22translate(30 192) rotate(12)%22%3E%3Cpath d=%22M14 0a12 12 0 0 1 12 12c0 9-12 22-12 22S2 21 2 12A12 12 0 0 1 14 0z%22/%3E%3Ccircle cx=%2214%22 cy=%2212%22 r=%224%22/%3E%3C/g%3E %3Cg transform=%22translate(108 190)%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2215%22/%3E%3Cpath d=%22M16 4v12l8 5%22/%3E%3C/g%3E %3Cg transform=%22translate(192 190) rotate(-10)%22%3E%3Crect x=%220%22 y=%220%22 width=%2234%22 height=%2226%22 rx=%224%22/%3E%3Cpath d=%22M0 8h34M6 18h8%22/%3E%3C/g%3E %3Cg transform 224%22/%3E%3Cpath d=%22M0 8h34M6 18h8%22/%3E%3C/g%3E %3Cg transform=%22translate(74 62)%22%3E%3Cpath d=%22M5 0v10M0 5h10%22/%3E%3C/g%3E%3Cg transform=%22translate(160 150)%22%3E%3Cpath d=%22M5 0v10M0 5h10%22/%3E%3C/g%3E %3Cg transform=%22translate(236 70)%22%3E%3Ccircle cx=%223%22 cy=%223%22 r=%222%22/%3E%3C/g%3E%3Cg transform=%22translate(80 150)%22%3E%3Ccircle cx=%223%22 cy=%223%22 r=%222%22/%3E%3C/g%3E%3Cg transform=%22translate(164 238)%22%3E%3Ccircle cx=%223%22 cy=%223%22 r=%222%22/%3E%3C/g%3E %3C/svg%3E'); } }
      html[data-theme='dark'] { --ab-doodle: url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22260%22 height=%22260%22 viewBox=%220 0 260 260%22 fill=%22none%22 stroke=%22rgba(255,255,255,0.06)%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E %3Cg transform=%22translate(18 20) rotate(-8)%22%3E%3Crect x=%220%22 y=%2222%22 width=%227%22 height=%2212%22 rx=%223.5%22/%3E%3Crect x=%2211%22 y=%2215%22 width=%227%22 height=%2219%22 rx=%223.5%22/%3E%3Crect x=%2222%22 y=%228%22 width=%227%22 height=%2226%22 rx=%223.5%22/%3E%3Crect x=%2233%22 y=%220%22 width=%227%22 height=%2234%22 rx=%223.5%22/%3E%3C/g%3E %3Cg transform=%22translate(100 18)%22%3E%3Cpath d=%22M0 4h6l6 22h20l5-16H9%22/%3E%3Ccircle cx=%2215%22 cy=%2232%22 r=%222.5%22/%3E%3Ccircle cx=%2229%22 cy=%2232%22 r=%222.5%22/%3E%3C/g%3E %3Cg transform=%22translate(190 26) rotate(10)%22%3E%3Cpath d=%22M0 10l16-9 16 9v18l-16 9-16-9z%22/%3E%3Cpath d=%22M0 10l16 9 16-9M16 19v18%22/%3E%3C/g%3E %3Cg transform=%22translate(26 104)%22%3E%3Cpath d=%22M0 30l11-12 9 7 15-17%22/%3E%3Cpath d=%22M28 8h7v7%22/%3E%3Cpath d=%22M0 38h40%22/%3E%3C/g%3E %3Cg transform=%22translate(112 98) rotate(-6)%22%3E%3Cpath d=%22M0 6h22v20H0zM22 12h9l6 7v7H22%22/%3E%3Ccircle cx=%227%22 cy=%2229%22 r=%223%22/%3E%3Ccircle cx=%2230%22 cy=%2229%22 r=%223%22/%3E%3C/g%3E %3Cg transform=%22translate(196 104)%22%3E%3Cpath d=%22M2 0h24v36l-4-3-4 3-4-3-4 3-4-3-4 3z%22/%3E%3Cpath d=%22M8 9h12M8 16h12M8 23h7%22/%3E%3C/g%3E %3Cg transform=%22translate(30 192) rotate(12)%22%3E%3Cpath d=%22M14 0a12 12 0 0 1 12 12c0 9-12 22-12 22S2 21 2 12A12 12 0 0 1 14 0z%22/%3E%3Ccircle cx=%2214%22 cy=%2212%22 r=%224%22/%3E%3C/g%3E %3Cg transform=%22translate(108 190)%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2215%22/%3E%3Cpath d=%22M16 4v12l8 5%22/%3E%3C/g%3E %3Cg transform=%22translate(192 190) rotate(-10)%22%3E%3Crect x=%220%22 y=%220%22 width=%2234%22 height=%2226%22 rx=%224%22/%3E%3Cpath d=%22M0 8h34M6 18h8%22/%3E%3C/g%3E %3Cg transform=%22translate(74 62)%22%3E%3Cpath d=%22M5 0v10M0 5h10%22/%3E%3C/g%3E%3Cg transform=%22translate(160 150)%22%3E%3Cpath d=%22M5 0v10M0 5h10%22/%3E%3C/g%3E %3Cg transform=%22translate(236 70)%22%3E%3Ccircle cx=%223%22 cy=%223%22 r=%222%22/%3E%3C/g%3E%3Cg transform=%22translate(80 150)%22%3E%3Ccircle cx=%223%22 cy=%223%22 r=%222%22/%3E%3C/g%3E%3Cg transform=%22translate(164 238)%22%3E%3Ccircle cx=%223%22 cy=%223%22 r=%222%22/%3E%3C/g%3E %3C/svg%3E'); }
      .ab-splash { background-color: var(--sk-page, #fff); background-image: radial-gradient(ellipse 260px 220px at 50% 50%, var(--sk-page, #fff) 40%, transparent 100%), radial-gradient(circle at 50% 46%, rgba(238,106,0,.10), transparent 32%), radial-gradient(circle at 56% 54%, rgba(14,109,253,.08), transparent 38%), var(--ab-doodle); background-size: auto, auto, auto, 260px 260px; animation: ab-drift 60s linear infinite; }
      @keyframes ab-drift { from { background-position: 0 0, 0 0, 0 0, 0 0; } to { background-position: 0 0, 0 0, 0 0, 260px 520px; } }
      .ab-splash .ab-badge { display: flex; align-items: center; justify-content: center; width: 128px; height: 128px; border-radius: 36px; background: var(--sk-card, #fff); box-shadow: 0 24px 60px -24px rgba(15,31,54,.35), 0 0 0 1px var(--sk-line, rgba(0,0,0,.08)); }
      .ab-splash .ab-tag { font-size: 13px; font-weight: 600; color: var(--sk-ink); opacity: .55; letter-spacing: .01em; margin-top: 6px; }
      .ab-signal { overflow: visible; }
      @media (prefers-reduced-motion: reduce) { .ab-splash { animation: none; } }
    </style>

    <!--
      Which front door this is. Runs in the head, before anything paints, and
      reads only `location.pathname`: the portal lives under /portal and the
      two auth screens are their own addresses, so everything else is the
      public site. Wrapped because a host that serves this markup without a
      location (a prerenderer, a mail client preview) must fall through to the
      portal shell rather than throw and paint nothing at all.
    -->
    <script>
      (function () {
        try {
          var p = location.pathname;
          var app = p.indexOf('/portal') === 0 || p === '/login' || p === '/forgot-password';
          if (!app) document.documentElement.setAttribute('data-boot', 'site');
        } catch (e) { /* portal shell it is */ }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="boot" class="ab-splash" role="status" aria-label="Loading AfterBI">
        <svg class="ab-signal" viewBox="-8 -14 146 146" width="104" height="104" overflow="visible" aria-hidden="true">
            <defs>
              <linearGradient id="abg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff7a1a"/><stop offset="1" stop-color="#f2332b"/></linearGradient>
              <linearGradient id="abg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd21f"/><stop offset="1" stop-color="#f5a400"/></linearGradient>
              <linearGradient id="abg3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3ddc7a"/><stop offset="1" stop-color="#02a05c"/></linearGradient>
              <linearGradient id="abg4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#45b0ff"/><stop offset="1" stop-color="#0e6dfd"/></linearGradient>
            </defs>
            <g transform="skewX(-9) translate(14 0)">
              <rect class="b1" x="3" y="78" width="25" height="36" rx="12.5" fill="url(#abg1)"/>
              <rect class="b2" x="35" y="55" width="25" height="59" rx="12.5" fill="url(#abg2)"/>
              <rect class="b3" x="67" y="37" width="25" height="77" rx="12.5" fill="url(#abg3)"/>
              <rect class="b4" x="99" y="20" width="25" height="94" rx="12.5" fill="url(#abg4)"/>
            </g>
          </svg>
        <div class="name">AfterBI</div>
        <div class="ab-tag">Sales and distribution, connected</div>
      </div>
    </div>
    <!--
      A BOOT FAILURE THAT SAYS WHAT IS WRONG, RATHER THAN A WHITE SCREEN.

      `lib/firebase.ts` throws at module scope when a `VITE_FIREBASE_*` variable
      is missing. That is deliberate, the build this replaced shipped a real
      project's keys as literals, so every fork pointed at production, but a
      module-scope throw happens while the bundle is still evaluating, before
      React exists. `ErrorBoundary` cannot catch it. Nothing in the bundle can.
      The page stays blank and the only evidence is a console line that whoever
      just deployed is probably not looking at.

      That is precisely the state a first deploy lands in, because nothing about
      a missing environment variable stops the build: Vite writes these values
      into the bundle at build time, so it compiles perfectly and then has
      nothing to connect to.

      This is inline, and before the module, for two reasons. It is the only
      code guaranteed to have run when the bundle throws, and it is the only
      code that runs at all if the bundle 404s, which is what a wrong output
      directory looks like from the browser.
    -->
    <script>
      (function () {
        var painted = false;

        function paint(message) {
          if (painted) return;
          painted = true;
          var root = document.getElementById('root');
          if (!root) return;

          var missing = /(VITE_[A-Z_]+) is not set/.exec(message || '');

          /* Built with the DOM, not innerHTML: `message` is an exception string
             and nothing has sanitised it. Styles are inline because the
             stylesheet may be the thing that did not load. */
          var box = document.createElement('div');
          box.setAttribute(
            'style',
            'max-width:34rem;margin:12vh auto;padding:0 1.5rem;font:15px/1.65 -apple-system,' +
              'BlinkMacSystemFont,Segoe UI,Arial,sans-serif;color:#1a1d21'
          );

          var h = document.createElement('h1');
          h.setAttribute('style', 'font-size:19px;font-weight:800;margin:0 0 .75rem');
          h.textContent = missing
            ? 'This deployment is missing its configuration'
            : 'AfterBI could not start';

          var p = document.createElement('p');
          p.setAttribute('style', 'margin:0 0 1rem;color:#41474d');
          p.textContent = missing
            ? missing[1] +
              ' is not set. The Firebase web config has to be set as an environment variable ' +
              'wherever this is hosted, and then the site rebuilt. A variable added after a ' +
              'build is not in the bundle, because these values are written in at build time.'
            : message || 'The application bundle did not load.';

          var q = document.createElement('p');
          q.setAttribute('style', 'margin:0;font-size:13px;color:#7a8087');
          q.textContent = missing
            ? 'The full list is in .env.example. None of it is secret: a Firebase web key ' +
              'identifies the project, it does not grant access; firestore.rules does that.'
            : 'The full error is in the browser console.';

          box.appendChild(h);
          box.appendChild(p);
          box.appendChild(q);
          root.replaceChildren ? root.replaceChildren(box) : ((root.innerHTML = ''), root.appendChild(box));
        }

        /* `true` for the capture phase, which is the only way to see a script
           that failed to LOAD: a resource error fires on the element and does
           not bubble, so a normal listener never hears it. That case is what a
           wrong output directory looks like from inside the browser. */
        window.addEventListener(
          'error',
          function (event) {
            /* Only while the skeleton is still the only thing on screen. Once
               React has mounted, its own ErrorBoundary owns the failure, and
               painting over a working app would be the bug. */
            if (!document.getElementById('boot')) return;

            var target = event && event.target;
            if (target && target !== window && target.tagName) {
              /*
               * A RESOURCE FAILED, NOT THE APP.
               *
               * Capturing catches every one of these, and the first version of
               * this guard treated them all as fatal, so a blocked Google
               * Fonts request painted "the bundle did not load" and, because it
               * arrives before the app's own error, buried the real message
               * naming the missing variable. A font that does not arrive is a
               * different typeface, not a broken app; the same goes for an
               * image. Only the bundle itself matters here.
               */
              if (target.tagName === 'SCRIPT' && target.type === 'module') paint('');
              return;
            }

            paint((event && event.message) || '');
          },
          true
        );

        /*
         * Last resort, and deliberately patient.
         *
         * This app's users are on mid-range Android phones on metered Nigerian
         * data, in depots with two bars, a cold load genuinely can take ten
         * seconds, and telling somebody it is broken while it is merely slow is
         * worse than the skeleton they were already looking at. Twenty-five
         * seconds is past any real cold start; if React does mount afterwards
         * it replaces this anyway, so the failure mode is self-correcting.
         */
        window.setTimeout(function () {
          if (document.getElementById('boot')) paint('');
        }, 25000);
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
